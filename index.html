<!DOCTYPE html>
<html>
<head>
    <title>我的永久文本编辑页</title>
    <style>
        .text-box {
            width: 80%;
            height: 300px;
            margin: 20px auto;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
        }
        button {
            display: block;
            margin: 0 auto;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2 style="text-align:center;">永久文本编辑框</h2>
    <textarea class="text-box" placeholder="在这里编辑文字..."></textarea>
    <button onclick="addTextBox()">新增文本框</button>

    <script>
        function addTextBox() {
            const newBox = document.createElement('textarea');
            newBox.className = 'text-box';
            newBox.placeholder = '新文本框，在这里编辑...';
            document.body.appendChild(newBox);
        }
    </script>
</body>
</html>
