<!DOCTYPE html>
<html>
<head>
    <title>我的永久文本编辑页</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .editable-title {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px dashed #ccc;
        }
        .editable-title:hover {
            background-color: #f8f9fa;
        }
        .style-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            margin: 0 auto 20px;
            max-width: 1200px;
            flex-wrap: wrap;
        }
        .style-controls select, .style-controls input[type="color"] {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }
        .style-controls input[type="color"] {
            width: 40px;
            height: 30px;
            border: none;
        }
        .text-box-wrapper {
            display: flex;
            align-items: flex-start;
            width: 100%;
            max-width: 1200px;
            margin: 15px auto;
            gap: 10px;
        }
        .text-box {
            flex: 1;
            width: 100%;
            min-width: 200px;
            min-height: 150px;
            max-width: calc(100% - 100px);
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            resize: both;
            transition: border-color 0.2s;
        }
        .text-box:focus {
            outline: none;
            border-color: #007bff;
        }
        .delete-btn {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .delete-btn:hover {
            background-color: #bb2d3b;
        }
        .add-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
        }
        .add-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h2 class="editable-title" id="mainTitle" contenteditable="true" spellcheck="false">永久文本编辑框</h2>

    <div class="style-controls">
        <label>字号：</label>
        <select id="fontSizeSelect">
            <option value="12px">小（12px）</option>
            <option value="16px" selected>默认（16px）</option>
            <option value="20px">中（20px）</option>
            <option value="24px">大（24px）</option>
            <option value="28px">特大（28px）</option>
        </select>

        <label>字体：</label>
        <select id="fontFamilySelect">
            <option value="Microsoft YaHei, sans-serif" selected>微软雅黑</option>
            <option value="SimSun, serif">宋体</option>
            <option value="SimHei, sans-serif">黑体</option>
            <option value="Arial, sans-serif">Arial</option>
            <option value="Times New Roman, serif">Times New Roman</option>
        </select>

        <label>字色：</label>
        <input type="color" id="fontColorPicker" value="#000000">
    </div>

    <div id="textBoxContainer">
        <div class="text-box-wrapper">
            <textarea class="text-box" placeholder="在这里编辑文字..."></textarea>
            <button class="delete-btn" onclick="deleteTextBox(this)">删除文本框</button>
        </div>
    </div>

    <button class="add-btn" onclick="addTextBox()">新增文本框</button>

    <script>
        let activeTextBox = document.querySelector('.text-box');
        const container = document.getElementById('textBoxContainer');
        const title = document.getElementById('mainTitle');

        // 初始化：加载保存的数据
        window.addEventListener('load', loadSavedData);
        // 标题编辑自动保存
        title.addEventListener('input', saveAllData);

        // 初始化文本框事件
        function initTextBoxEvents(box) {
            box.addEventListener('focus', () => {
                activeTextBox = box;
                syncStyleSelectors();
            });
            box.addEventListener('input', saveAllData);
        }
        document.querySelectorAll('.text-box').forEach(initTextBoxEvents);

        // 样式同步
        function syncStyleSelectors() {
            const style = window.getComputedStyle(activeTextBox);
            document.getElementById('fontSizeSelect').value = style.fontSize;
            document.getElementById('fontColorPicker').value = rgbToHex(style.color);
        }
        function rgbToHex(rgb) {
            const [r,g,b] = rgb.match(/\d+/g);
            return "#" + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
        }

        // 样式修改
        document.getElementById('fontSizeSelect').addEventListener('change', e => {
            activeTextBox.style.fontSize = e.target.value;
            saveAllData();
        });
        document.getElementById('fontFamilySelect').addEventListener('change', e => {
            activeTextBox.style.fontFamily = e.target.value;
            saveAllData();
        });
        document.getElementById('fontColorPicker').addEventListener('input', e => {
            activeTextBox.style.color = e.target.value;
            saveAllData();
        });

        // 新增文本框
        function addTextBox() {
            const wrapper = document.createElement('div');
            wrapper.className = 'text-box-wrapper';
            
            const newBox = document.createElement('textarea');
            newBox.className = 'text-box';
            newBox.placeholder = '新文本框...';
            newBox.style.fontSize = document.getElementById('fontSizeSelect').value;
            newBox.style.fontFamily = document.getElementById('fontFamilySelect').value;
            newBox.style.color = document.getElementById('fontColorPicker').value;
            
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.textContent = '删除文本框';
            delBtn.onclick = () => deleteTextBox(delBtn);

            wrapper.append(newBox, delBtn);
            container.appendChild(wrapper);
            initTextBoxEvents(newBox);
            newBox.focus();
            saveAllData();
        }

        // 删除文本框
        function deleteTextBox(btn) {
            const wrapper = btn.closest('.text-box-wrapper');
            const total = container.querySelectorAll('.text-box-wrapper').length;
            if(total > 1){
                wrapper.remove();
                saveAllData();
            }else{
                alert('至少保留一个文本框！');
                wrapper.querySelector('.text-box').value = '';
                saveAllData();
            }
        }

        // ============== 核心：自动保存/读取功能 ==============
        function saveAllData() {
            const data = {
                title: title.innerText,
                boxes: []
            };
            container.querySelectorAll('.text-box-wrapper').forEach(wrap => {
                const box = wrap.querySelector('.text-box');
                data.boxes.push({
                    content: box.value,
                    fontSize: box.style.fontSize,
                    fontFamily: box.style.fontFamily,
                    color: box.style.color
                });
            });
            localStorage.setItem('myTextSiteData', JSON.stringify(data));
        }

        function loadSavedData() {
            const saved = localStorage.getItem('myTextSiteData');
            if(!saved) return;
            const data = JSON.parse(saved);
            
            // 恢复标题
            title.innerText = data.title;
            
            // 清空默认框
            container.innerHTML = '';
            
            // 恢复所有文本框
            data.boxes.forEach(boxData => {
                const wrapper = document.createElement('div');
                wrapper.className = 'text-box-wrapper';
                
                const textarea = document.createElement('textarea');
                textarea.className = 'text-box';
                textarea.value = boxData.content;
                textarea.style.fontSize = boxData.fontSize || '16px';
                textarea.style.fontFamily = boxData.fontFamily || 'Microsoft YaHei, sans-serif';
                textarea.style.color = boxData.color || '#000000';
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = '删除文本框';
                delBtn.onclick = () => deleteTextBox(delBtn);

                wrapper.append(textarea, delBtn);
                container.appendChild(wrapper);
                initTextBoxEvents(textarea);
            });
            activeTextBox = container.querySelector('.text-box');
        }
    </script>
</body>
</html>
