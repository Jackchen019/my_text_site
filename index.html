<!DOCTYPE html>
<html>
<head>
    <title>我的永久文本编辑页</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            padding: 20px;
        }
        /* 可编辑标题样式 */
        .editable-title {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px dashed #ccc;
        }
        .editable-title:hover {
            color: #2c3e50;
            background-color: #f8f9fa;
        }
        /* 文本框容器（适配文本框+删除按钮） */
        .text-box-wrapper {
            display: flex;
            align-items: flex-start;
            width: 100%;
            max-width: 1200px;
            margin: 15px auto;
        }
        /* 自适应文本框样式 */
        .text-box {
            flex: 1;
            height: 300px;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            resize: vertical; /* 允许垂直调整大小，保持宽度自适应 */
            min-width: 200px; /* 最小宽度，防止缩得太窄 */
        }
        /* 删除按钮样式 */
        .delete-btn {
            margin-left: 10px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            white-space: nowrap;
        }
        .delete-btn:hover {
            background-color: #bb2d3b;
        }
        /* 新增按钮样式 */
        .add-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
        }
        .add-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <!-- 可编辑的大标题 -->
    <h2 class="editable-title" contenteditable="true" spellcheck="false">永久文本编辑框</h2>

    <!-- 初始文本框容器 -->
    <div class="text-box-wrapper">
        <textarea class="text-box" placeholder="在这里编辑文字..."></textarea>
        <button class="delete-btn" onclick="deleteTextBox(this)">删除文本框</button>
    </div>

    <!-- 新增按钮 -->
    <button class="add-btn" onclick="addTextBox()">新增文本框</button>

    <script>
        // 新增文本框函数
        function addTextBox() {
            // 创建文本框容器
            const wrapper = document.createElement('div');
            wrapper.className = 'text-box-wrapper';

            // 创建文本框
            const newBox = document.createElement('textarea');
            newBox.className = 'text-box';
            newBox.placeholder = '新文本框，在这里编辑...';

            // 创建删除按钮
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerText = '删除文本框';
            deleteBtn.onclick = function() {
                deleteTextBox(this);
            };

            // 组装容器
            wrapper.appendChild(newBox);
            wrapper.appendChild(deleteBtn);

            // 插入到新增按钮上方
            const addBtn = document.querySelector('.add-btn');
            document.body.insertBefore(wrapper, addBtn);
        }

        // 删除文本框函数
        function deleteTextBox(btn) {
            // 获取当前文本框容器
            const wrapper = btn.closest('.text-box-wrapper');
            // 至少保留一个文本框
            const allWrappers = document.querySelectorAll('.text-box-wrapper');
            if (allWrappers.length > 1) {
                wrapper.remove();
            } else {
                alert('至少需要保留一个文本框！');
                // 清空当前文本框内容（可选）
                wrapper.querySelector('.text-box').value = '';
            }
        }
    </script>
</body>
</html>
